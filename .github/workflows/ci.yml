name: Enterprise Observability CI and Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Test, validate and scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install application dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Run application tests
        run: python -m pytest -v tests/

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r app/requirements.txt

      - name: Validate Docker Compose configuration
        env:
          GRAFANA_ADMIN_PASSWORD: ci-validation-placeholder
        run: docker compose config -q

      - name: Build Product Service image for scanning
        run: |
          docker build \
            --file app/product-service/Dockerfile \
            --tag enterprise-observability-product-service:ci \
            .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: enterprise-observability-product-service:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
