services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: observability-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    container_name: observability-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    container_name: observability-tempo
    command:
      - -config.file=/etc/tempo/tempo.yaml
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    container_name: observability-otel-collector
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: app/product-service/Dockerfile
    container_name: observability-product-service
    environment:
      DEPLOYMENT_ENV: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      - otel-collector
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:
